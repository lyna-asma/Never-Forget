<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Never-Forget — Manage Widgets
  </title>

  <link
    rel="stylesheet"
    href="./manager.css"
  />

</head>

<body>

  <main class="manager">

    <header class="manager-header">

      <div>
        <h1>
          Manage Widgets
        </h1>

        <p>
          Create, view, and manage your desktop widgets.
        </p>
      </div>

      <div class="add-buttons">

        <button
          id="add-task"
        >
          + Task
        </button>

        <button
          id="add-image"
        >
          + Image
        </button>

      </div>

    </header>


    <section
      id="widget-list"
      class="widget-list"
    >
    </section>

  </main>

  <script src="./manager.js"></script>

</body>

</html>
