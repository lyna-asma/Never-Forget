<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Never-Forget</title>

  <link
    rel="stylesheet"
    href="./style.css"
  />
</head>

<body>

  <main
    id="widget"
    class="widget"
  >

    <header
      id="widget-header"
      class="header"
    >

      <h1
        id="widget-title"
        class="editable"
        contenteditable="false"
      >
        Never-Forget
      </h1>

      <span
        id="notion-badge"
        class="notion-badge"
        style="display: none;"
        title="Linked to Notion"
      >
        ☁️
      </span>

      <span
        id="edit-indicator"
        class="edit-indicator"
      >
        Editing
      </span>

    </header>


    <section
      id="widget-content"
      class="content"
    >
    </section>

  </main>

  <script src="./renderer.js"></script>

</body>
</html>
